<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فرۆشیار — شەکرۆکە</title>
<meta name="theme-color" content="#1b3fd1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f5fc;--card:#fff;--ink:#0f1a52;--mut:#5d6592;--pri:#1b3fd1;--ok:#4f7a2a;--bd:#e0e3f3}
@media(prefers-color-scheme:dark){:root{--bg:#090e2b;--card:#131a42;--ink:#eef0ff;--mut:#a7aed8;--pri:#4a6cf7;--ok:#9acd5f;--bd:#2a336b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0;flex:1}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button{flex:none}
main{max-width:900px;margin:0 auto;padding:0 16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--card);padding:8px 16px;border-radius:8px;cursor:pointer}
button.on,button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.del{color:var(--pri)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}
.item img{width:100%;height:130px;object-fit:cover;display:block;background:var(--bd)}
.item div{padding:10px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:none}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600}
.big{font-size:28px;font-weight:700}
.stat{flex:1!important;min-width:140px}
.muted{color:var(--mut)}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd)}
.err{color:var(--pri);min-height:1.4em}
.hide{display:none!important}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
#receipt{display:none}
/* ---- Shekroke theme ---- */
body{font-family:Vazirmatn,"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
header{background:#1b3fd1;color:#fff;border:0;flex-wrap:wrap}
header h1{display:flex;align-items:center;gap:10px}header h1 img{height:40px;width:auto}
header h1 span{font-size:15px;font-weight:600;opacity:.85}
header .muted,header label{color:#fff}
header button{background:transparent;border-color:#fff8;color:#fff}
nav button{border-radius:99px;font-weight:600}
.box,.item{border-radius:16px;box-shadow:0 4px 14px #0f1a520f}
#login{text-align:center;border-top:6px solid #f6bc3c}
#login input{text-align:start}#login label{text-align:start}
#login .brand{display:block;background:#1b3fd1;border-radius:12px;padding:14px}
#login .brand img{width:200px;height:auto;display:block;margin:0 auto}
#login .pri{width:100%}
#boot{color:var(--mut)}
@media print{body>*:not(#receipt){display:none!important}#receipt{display:block;width:72mm;font:13px/1.5 monospace;color:#000;direction:rtl}#receipt hr{border:0;border-top:1px dashed #000}}
</style>
</head>
<body>
<p id="boot" class="muted" style="text-align:center;margin-top:30vh">بارکردن...</p>
<section id="login" class="box hide">
  <div class="brand"><img src="logo-white.png" alt="شەکرۆکە" width="500" height="196"></div>
  <h1>چوونەژوورەوە</h1>
  <label for="em">ناوی بەکارهێنەر یان ئیمەیڵ</label><input id="em" dir="ltr" autocapitalize="none" autocomplete="username">
  <label for="pw">وشەی نهێنی</label><input id="pw" type="password" dir="ltr">
  <p id="lerr" class="muted"></p>
  <button class="pri" id="lbtn">چوونەژوورەوە</button>
</section>

<div id="app" class="hide">
<header><h1><img src="logo-white.png" alt="شەکرۆکە" width="500" height="196"><span>فرۆشیار</span></h1><span id="who" class="muted"></span>
  <label class="row" id="autoL" style="margin:0"><input type="checkbox" id="auto" style="width:auto" checked> چاپی خۆکار</label>
  <button id="out">دەرچوون</button></header>
<nav id="tabs">
  <button data-t="orders" class="on">داواکاری</button>
  <button data-t="items">ئایتمەکان</button>
  <button data-t="report">ڕاپۆرت</button>
  <button data-t="staff">ستاف</button>
  <button data-t="qr">QR مێزەکان</button>
</nav>
<main>
<section id="t-orders"><p id="oempty" class="muted">هێشتا داواکاری نییە. داواکاری نوێ لێرە دەردەکەوێت و چاپ دەکرێت.</p><div id="olist"></div></section>

<section id="t-items" class="hide">
  <div class="box">
    <h2 id="ftitle" style="margin-top:0">ئایتمی نوێ</h2>
    <input type="hidden" id="iid">
    <label for="iname">ناو</label><input id="iname">
    <div class="row"><div style="flex:1;min-width:140px"><label for="iprice">نرخ (دینار)</label><input id="iprice" type="number" min="0" inputmode="numeric"></div>
    <div style="flex:1;min-width:140px"><label for="icat">پۆل</label><input id="icat" placeholder="کێک، باقلاوە..."></div></div>
    <label for="idesc">باسکردن</label><textarea id="idesc" rows="2"></textarea>
    <label class="row" style="margin-top:12px;color:var(--ink)"><input type="checkbox" id="ifeat" style="width:auto"> تایبەت: لە سەرەوەی مینیوی کڕیار پیشان بدرێت</label>
    <label for="ifile">وێنە</label><input id="ifile" type="file" accept="image/*">
    <img id="iprev" alt="" class="hide" style="height:90px;margin-top:8px;border-radius:8px">
    <div class="row" style="margin-top:14px"><button class="pri" id="isave">پاشەکەوتکردنی ئایتم</button><button id="icancel" class="hide">هەڵوەشاندنەوە</button></div>
  </div>
  <div class="grid" id="ilist"></div>
</section>

<section id="t-staff" class="hide">
  <div class="box"><h2 style="margin-top:0">ستافی نوێ</h2>
    <label for="sn">ناو</label><input id="sn">
    <div class="row"><div style="flex:1;min-width:140px"><label for="sp">مۆبایل</label><input id="sp" type="tel" dir="ltr"></div>
    <div style="flex:1;min-width:140px"><label for="sr">ڕۆڵ</label><select id="sr"><option value="cashier">کاشێر</option><option value="delivery">دلیڤەری</option><option value="waiter">گارسۆن</option><option value="admin">بەڕێوەبەر</option></select></div></div>
    <label for="se">ناوی بەکارهێنەر یان ئیمەیڵ</label><input id="se" dir="ltr" autocapitalize="none">
    <label for="sw">وشەی نهێنی (٦ پیت یان زیاتر)</label><input id="sw" dir="ltr" autocapitalize="none">
    <p id="serr" class="err" role="alert"></p><button class="pri" id="sadd">دروستکردنی ستاف</button></div>
  <div id="slist"></div>
</section>

<section id="t-qr" class="hide">
  <div class="box">
    <label for="qn">ژمارەی مێزەکان</label><input id="qn" type="number" min="1" max="60" value="10">
    <label for="qu">ئادرەسی وێبی مێز</label><input id="qu" dir="ltr">
    <div class="row" style="margin-top:12px"><button class="pri" id="qgo">دروستکردنی QR</button><button id="qpr">چاپکردن</button></div>
  </div>
  <div class="grid" id="qgrid"></div>
</section>

<section id="t-report" class="hide">
  <div class="box row">
    <select id="rtype" style="width:auto"><option value="day">ڕۆژانە</option><option value="month">مانگانە</option></select>
    <input id="rday" type="date" style="width:auto"><input id="rmon" type="month" class="hide" style="width:auto">
  </div>
  <div class="row" style="margin-bottom:16px">
    <div class="box stat"><div class="muted">کۆی داهات</div><div class="big" id="rsum">0</div></div>
    <div class="box stat"><div class="muted">ژمارەی داواکاری</div><div class="big" id="rcnt">0</div></div>
  </div>
  <div class="box"><h2 style="margin-top:0">فرۆشتنی ئایتمەکان</h2>
    <div style="overflow-x:auto"><table><thead><tr><th>ئایتم</th><th>ژمارەی فرۆشراو</th><th>داهات</th></tr></thead><tbody id="rrows"></tbody></table></div>
    <p id="rempty" class="muted hide">لەم ماوەیەدا هیچ فرۆشتنێک نییە.</p></div>
</section>
</main>
</div>
<div id="receipt"></div>
<link rel="preload" as="image" href="logo-navy.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,setPersistence,browserLocalPersistence,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase,ref,get,onValue,push,set,update,remove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const cfg={
  apiKey:"AIzaSyDLxTVgoGaTmN5eZdJXHXuLq95xQY67bUs",
  authDomain:"shyryny.firebaseapp.com",
  databaseURL:"https://shyryny-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"shyryny",
  appId:"1:458463996741:web:96e04695e1ea5480abac2c"
};
const app=initializeApp(cfg);
const auth=getAuth(app),db=getDatabase(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n||0).toLocaleString("en")+" دینار";
const STAT={new:"نوێ",ready:"ئامادەیە",onway:"بەڕێکەوت",done:"گەیشت",cancelled:"هەڵوەشاوە"};
const mail=v=>v.includes("@")?v:v+"@shyryny.app";
const ROLE={admin:"بەڕێوەبەر",cashier:"کاشێر",delivery:"دلیڤەری",waiter:"گارسۆن"};
const PERM={admin:["orders","items","report","staff","qr"],cashier:["orders","report"],delivery:["orders"],waiter:["orders"]};
let role="",me={},staff={};
let items={},orders={},imgData="",started=false,printed=new Set(),first=true;

/* ---- login ---- */
$("lbtn").onclick=async()=>{
  $("lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,mail($("em").value.trim().toLowerCase()),$("pw").value)}
  catch(e){const m={"auth/invalid-credential":"ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە، یان ئەم بەکارهێنەرە لە Authentication نییە.","auth/invalid-email":"ئیمەیڵەکە ڕاست نییە و دەبێت @ی تێدا بێت.","auth/operation-not-allowed":"لە Firebase → Authentication → Sign-in method، Email/Password چالاک نەکراوە.","auth/network-request-failed":"پەیوەندی ئینتەرنێت نییە.","auth/too-many-requests":"زۆر هەوڵت دا، کەمێک چاوەڕێ بکە."}[e.code];
    $("lerr").textContent=(m||"هەڵە")+" ("+e.code+")"}
};
$("out").onclick=async()=>{await signOut(auth);location.reload()};
onAuthStateChanged(auth,async u=>{
  if(u){
    let why="";me={};role="";
    try{me=(await get(ref(db,"staff/"+u.uid))).val()||{};role=me.role;
      if(!me.role)why="لە /staff تۆمارێک نییە کە کلیلەکەی ئەم UID بێت: "+u.uid;else if(!PERM[role])why="role ی ئەم تۆمارە دروست نییە."}
    catch(e){if(!/PERMISSION_DENIED|permission/i.test(e.code+" "+e.message)){$("boot").textContent="پەیوەندی ئینتەرنێت نییە. لاپەڕەکە نوێ بکەرەوە.";return}why="Rulesـەکان ڕێگە نادەن بخوێنرێتەوە (Permission denied). Rulesـی نوێ Publish بکە."}
    if(why||!PERM[role]){$("lerr").textContent=why||"ئەم هەژمارە ڕێگەپێدراو نییە.";await signOut(auth);return}
    applyRole();
  }
  $("boot").classList.add("hide");
  $("login").classList.toggle("hide",!!u);
  $("app").classList.toggle("hide",!u);
  if(u&&!started){started=true;listen()}
});

function applyRole(){
  const p=PERM[role],a=["admin","cashier"].includes(role);
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("hide",!p.includes(b.dataset.t)));
  $("who").textContent=(me.name||"")+" — "+ROLE[role];
  $("autoL").classList.toggle("hide",!a);$("auto").checked=a;
  let t="orders";try{t=localStorage.getItem("tab")||"orders"}catch{}
  if(!p.includes(t))t="orders";
  document.querySelector('#tabs button[data-t="'+t+'"]').click();
}

/* ---- tabs ---- */
$("tabs").onclick=e=>{
  const t=e.target.dataset.t;if(!t)return;
  try{localStorage.setItem("tab",t)}catch{}
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b===e.target));
  ["orders","items","report","staff","qr"].forEach(k=>$("t-"+k).classList.toggle("hide",k!==t));
  if(t==="report")report();
};

/* ---- realtime listeners ---- */
function listen(){
  if(role==="admin")onValue(ref(db,"staff"),s=>{staff=s.val()||{};renderStaff()});
  onValue(ref(db,"items"),s=>{items=s.val()||{};renderItems()});
  onValue(ref(db,"orders"),s=>{
    orders=s.val()||{};renderOrders();
    const ids=Object.keys(orders);
    if(first){ids.forEach(i=>printed.add(i));first=false}
    else ids.filter(i=>!printed.has(i)).forEach(i=>{printed.add(i);beep();if($("auto").checked)printOrder(i)});
    report();
  });
}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch{}}

/* ---- items ---- */
$("ifile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{
    const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    imgData=c.toDataURL("image/jpeg",.72);$("iprev").src=imgData;$("iprev").classList.remove("hide");
  };im.src=URL.createObjectURL(f);
};
function resetForm(){
  ["iid","iname","iprice","icat","idesc","ifile"].forEach(i=>$(i).value="");
  $("ifeat").checked=false;imgData="";$("iprev").classList.add("hide");$("ftitle").textContent="ئایتمی نوێ";$("icancel").classList.add("hide");
}
$("icancel").onclick=resetForm;
$("isave").onclick=async()=>{
  const name=$("iname").value.trim(),price=Number($("iprice").value);
  if(!name||!(price>=0)||$("iprice").value===""){alert("ناو و نرخ پێویستن.");return}
  const id=$("iid").value,old=id?items[id]:null;
  const data={name,price,cat:$("icat").value.trim(),desc:$("idesc").value.trim(),img:imgData||old?.img||"",active:old?old.active!==false:true,feat:$("ifeat").checked};
  try{
    if(id)await set(ref(db,"items/"+id),data);else await set(push(ref(db,"items")),data);
    resetForm();
  }catch{alert("پاشەکەوت نەکرا. پەیوەندی ئینتەرنێت و ڕێساکانی Firebase بپشکنە.")}
};
function renderItems(){
  const ids=Object.keys(items);
  $("ilist").innerHTML=ids.length?ids.map(id=>{const i=items[id];return `<div class="item">${i.img?`<img src="${i.img}" alt="">`:`<img alt="">`}<div><b>${i.feat?"★ ":""}${esc(i.name)}</b><div class="muted">${esc(i.cat)}</div><div>${money(i.price)}</div><div class="muted">${esc(i.desc)}</div>
  <div class="row" style="margin-top:8px"><button data-e="${id}">دەستکاری</button><button data-f="${id}">${i.feat?"لابردنی تایبەت":"تایبەت ★"}</button><button data-a="${id}">${i.active===false?"پیشاندان":"شاردنەوە"}</button><button class="del" data-d="${id}">سڕینەوە</button></div></div></div>`}).join(""):`<p class="muted">هیچ ئایتمێک نییە. لە فۆرمەکەی سەرەوە یەکەم ئایتم زیاد بکە.</p>`;
}
$("ilist").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e){const i=items[b.dataset.e];$("iid").value=b.dataset.e;$("iname").value=i.name;$("iprice").value=i.price;$("icat").value=i.cat||"";$("idesc").value=i.desc||"";$("ifeat").checked=!!i.feat;imgData="";
    if(i.img){$("iprev").src=i.img;$("iprev").classList.remove("hide")}$("ftitle").textContent="دەستکاریکردنی ئایتم";$("icancel").classList.remove("hide");scrollTo({top:0,behavior:"smooth"})}
  if(b.dataset.f)update(ref(db,"items/"+b.dataset.f),{feat:!items[b.dataset.f].feat});
  if(b.dataset.a)update(ref(db,"items/"+b.dataset.a),{active:items[b.dataset.a].active===false});
  if(b.dataset.d&&confirm("ئەم ئایتمە بسڕدرێتەوە؟"))remove(ref(db,"items/"+b.dataset.d));
};

/* ---- orders ---- */
function renderOrders(){
  const ids=Object.keys(orders).sort((a,b)=>orders[b].ts-orders[a].ts);
  $("oempty").classList.toggle("hide",!!ids.length);
  $("olist").innerHTML=ids.map(id=>{const o=orders[id];return `<div class="box"><div class="row"><b>${o.type==="dinein"?"مێز "+esc(o.table):esc(o.name)}</b>${o.phone?`<a href="tel:${esc(o.phone)}" dir="ltr">${esc(o.phone)}</a>`:""}<span class="muted">${new Date(o.ts).toLocaleString("en-GB")}</span><span class="tag">${STAT[o.status]||""}</span></div>
  <div class="muted">${o.type==="dinein"?(o.name&&o.name!=="مێز "+o.table?esc(o.name):""):esc(o.address)}${o.note?" — "+esc(o.note):""}</div>
  <ul>${(o.items||[]).map(i=>`<li>${esc(i.name)} × ${i.qty}</li>`).join("")}</ul>
  <div class="row"><b>${money(o.total)}</b><select data-s="${id}" style="width:auto">${Object.entries(STAT).filter(([k])=>role!=="delivery"||k===o.status||["onway","done"].includes(k)).map(([k,v])=>`<option value="${k}"${k===o.status?" selected":""}>${v}</option>`).join("")}</select><button data-p="${id}">چاپکردن</button></div></div>`}).join("");
}
$("olist").onchange=e=>{if(e.target.dataset.s)update(ref(db,"orders/"+e.target.dataset.s),{status:e.target.value})};
$("olist").onclick=e=>{const p=e.target.dataset.p;if(p)printOrder(p)};
function printOrder(id){
  const o=orders[id];if(!o)return;
  $("receipt").innerHTML=`<img src="logo-navy.png" alt="شەکرۆکە" style="display:block;width:45mm;margin:0 auto"><hr>${new Date(o.ts).toLocaleString("en-GB")}<br>${o.type==="dinein"?"مێز "+esc(o.table)+(o.name&&o.name!=="مێز "+o.table?" — "+esc(o.name):""):esc(o.name)+" — "+esc(o.phone)+"<br>"+esc(o.address)}${o.note?"<br>"+esc(o.note):""}<hr>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty} = ${(i.price*i.qty).toLocaleString("en")}`).join("<br>")}<hr><b>کۆ: ${money(o.total)}</b>`;
  setTimeout(()=>window.print(),150);
}

/* ---- staff ---- */
$("sadd").onclick=async()=>{
  const name=$("sn").value.trim(),phone=$("sp").value.trim(),raw=$("se").value.trim().toLowerCase(),pw=$("sw").value,r=$("sr").value;
  $("serr").textContent="";
  if(!name||!raw||pw.length<6){$("serr").textContent="ناو، ناوی بەکارهێنەر و وشەی نهێنی (٦ پیت یان زیاتر) پێویستن.";return}
  $("sadd").disabled=true;
  const au2=getAuth(getApps().find(x=>x.name==="sec")||initializeApp(cfg,"sec"));
  try{
    const email=mail(raw),c=await createUserWithEmailAndPassword(au2,email,pw);
    await set(ref(db,"staff/"+c.user.uid),{name,phone,email,role:r,ts:Date.now()});
    await signOut(au2);
    ["sn","sp","se","sw"].forEach(i=>$(i).value="");
  }catch(e){$("serr").textContent=e.code==="auth/email-already-in-use"?"ئەم ناوی بەکارهێنەرە پێشتر بەکارهاتووە.":e.code==="auth/weak-password"?"وشەی نهێنی لاوازە.":"دروست نەکرا. دووبارە هەوڵ بدەرەوە."}
  $("sadd").disabled=false;
};
function renderStaff(){
  const my=auth.currentUser?.uid;
  $("slist").innerHTML=Object.entries(staff).map(([id,s])=>`<div class="box"><div class="row"><b>${esc(s.name)}</b><span class="tag">${ROLE[s.role]||esc(s.role)}</span><span class="muted" dir="ltr">${esc(s.email)}</span><span class="muted" dir="ltr">${esc(s.phone)}</span></div>${id===my?"":`<div class="row" style="margin-top:8px"><select data-r="${id}" style="width:auto">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}"${k===s.role?" selected":""}>${v}</option>`).join("")}</select><button class="del" data-x="${id}">لابردنی دەستڕاگەیشتن</button></div>`}</div>`).join("");
}
$("slist").onchange=e=>{if(e.target.dataset.r)update(ref(db,"staff/"+e.target.dataset.r),{role:e.target.value})};
$("slist").onclick=e=>{const id=e.target.dataset.x;if(id&&confirm("ئەم ستافە چیتر ناتوانێت بچێتە ژوورەوە. بەردەوام بیت؟"))remove(ref(db,"staff/"+id))};

/* ---- table QR ---- */
$("qu").value=location.href.split(/[?#]/)[0].replace(/[^/]*$/,"")+"table.html";
$("qgo").onclick=()=>{
  const n=Math.min(60,Math.max(1,+$("qn").value||1)),u=$("qu").value.trim();
  $("qgrid").innerHTML="";
  for(let i=1;i<=n;i++){
    const c=document.createElement("div");c.className="item";c.style.textAlign="center";c.innerHTML=`<div><b>مێز ${i}</b><div class="q" style="display:flex;justify-content:center;margin-top:8px"></div></div>`;
    $("qgrid").appendChild(c);
    new QRCode(c.querySelector(".q"),{text:u+"?t="+i,width:150,height:150});
  }
};
$("qpr").onclick=()=>{
  const cs=[...$("qgrid").children].map((c,i)=>{const im=c.querySelector("img");return im?`<div class="c"><img src="${new URL("logo-navy.png",location.href).href}" width="150" alt="شەکرۆکە"><h2>مێز ${i+1}</h2><img src="${im.src}" width="170"><p>بۆ داواکردن سکان بکە</p></div>`:""}).join("");
  if(!cs){alert("سەرەتا QR دروست بکە.");return}
  const w=open("");w.document.write(`<html dir="rtl"><body style="font-family:sans-serif"><style>.c{display:inline-block;width:210px;text-align:center;margin:8px;border:1px solid #000;padding:10px;page-break-inside:avoid}</style>${cs}</body></html>`);
  w.document.close();setTimeout(()=>w.print(),400);
};

/* ---- reports ---- */
const today=new Date().toLocaleDateString("en-CA");
$("rday").value=today;$("rmon").value=today.slice(0,7);
$("rtype").onchange=()=>{const m=$("rtype").value==="month";$("rday").classList.toggle("hide",m);$("rmon").classList.toggle("hide",!m);report()};
$("rday").onchange=$("rmon").onchange=report;
function report(){
  const m=$("rtype").value==="month",key=m?$("rmon").value:$("rday").value,len=key.length;
  const list=Object.values(orders).filter(o=>o.status!=="cancelled"&&new Date(o.ts).toLocaleDateString("en-CA").slice(0,len)===key);
  const by={};let sum=0;
  list.forEach(o=>{sum+=o.total||0;(o.items||[]).forEach(i=>{const r=by[i.name]||(by[i.name]={q:0,m:0});r.q+=i.qty;r.m+=i.qty*i.price})});
  $("rsum").textContent=money(sum);$("rcnt").textContent=list.length;
  const rows=Object.entries(by).sort((a,b)=>b[1].q-a[1].q);
  $("rrows").innerHTML=rows.map(([n,r])=>`<tr><td>${esc(n)}</td><td>${r.q}</td><td>${money(r.m)}</td></tr>`).join("");
  $("rempty").classList.toggle("hide",!!rows.length);
}
</script>
